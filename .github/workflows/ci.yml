# ==============================================================================
# PaperLens CI/CD 流水线
# ==============================================================================
# 【模块职责】
#   每次 push 到 master 分支时，在干净的 Linux 环境里自动完成：
#   安装依赖 -> 下载模型 -> 跑核心测试 -> 同步到魔搭创空间 -> 触发 Docker 构建。
#
# 【在架构中的位置】
#   开发流程的自动化门禁。不参与运行时请求，但决定了代码能否上线。
#
# 【类级（Job 级）说明】
#   拆分为 test 和 deploy 两个 Job。
#   - test：负责环境准备、模型缓存和纯逻辑/依赖模型测试。
#   - deploy：依赖 test 成功，负责同步与触发魔搭部署。
# ==============================================================================

name: CI/CD - Test & Deploy to ModelScope

on:
  push:
    branches: [ master ]

# 同一分支只保留一个流水线实例：新 push 自动取消仍在跑的旧 run
# （否则两个 run 会同时向魔搭推送，把构建排成两个，耗时翻倍）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: 测试 (CI)
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ./models
          key: models-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest modelscope

      - name: Download models (if cache miss)
        run: |
          if [ ! -d "./models/bge-small-en-v1.5" ]; then
            echo "模型不存在，从 ModelScope 下载..."
            python -c "from modelscope import snapshot_download; snapshot_download('BAAI/bge-small-en-v1.5', local_dir='./models/bge-small-en-v1.5', max_workers=8); snapshot_download('BAAI/bge-reranker-base', local_dir='./models/bge-reranker-base', max_workers=8)"
          else
            echo "模型缓存命中，跳过下载。"
          fi

      - name: Run core tests
        env:
          HF_HUB_OFFLINE: 1
          TRANSFORMERS_OFFLINE: 1
        run: |
          echo "=== 1. 解析与索引测试 ==="
          pytest test_ingest.py test_index_store.py -v

          echo "=== 2. 评估逻辑测试（排除依赖 API Key 的用例）==="
          pytest test_eval.py -v -k "not test_answer_on_answerable and not test_chinese_query_uses_zh_threshold"

          echo "=== 3. QA 异常文案映射纯函数测试 ==="
          pytest test_qa.py -v -k "test_20e_error_to_message"

  # ============================================================================
  # Job 2: 部署 (CD)
  # ============================================================================
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Trigger ModelScope Rebuild via Git Push
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MS_REPO: ${{ secrets.MODELSCOPE_REPO_ID }}
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 1. 备份当前 Github 仓库的所有代码
          mkdir -p /tmp/source_code
          cp -r . /tmp/source_code/
          
          # 2. 关联魔搭仓库
          git remote add modelscope "https://oauth2:${MS_TOKEN}@www.modelscope.cn/studios/${MS_REPO}.git"
          
          # 3. 强制将本地分支重置到魔搭的初始 commit（历史完全对齐）
          git fetch modelscope master
          git reset --hard modelscope/master
          
          # 4. 清空工作区，把 Github 代码拷贝回来
          rm -rf ./*
          cp -r /tmp/source_code/* .
          
          # 5. 打破构建缓存：只追加一行触发注释（requirements 已无乱码与多余空行，无需再清理）
          echo "# rebuild trigger $(date +%s)" >> requirements.txt
          
          git add -A
          git commit -m "chore: trigger modelscope rebuild $(date +%s)"
          
          # 6. 推送到魔搭
          git push modelscope master:master

      - name: Verify ModelScope build (deploy 尝试 + 状态轮询)
        if: always()
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MS_REPO: ${{ secrets.MODELSCOPE_REPO_ID }}
        run: |
          set +e
          API_OPEN="https://modelscope.cn/openapi/v1/studios/${MS_REPO}"
          API_WEB="https://www.modelscope.cn/api/v1/studio/${MS_REPO}"
          start_ts=$(date +%s)
          echo "push_time=${start_ts}"

          # 1) 显式调 deploy（token 已验证可用于 openapi；非必需，push 本身会触发构建）
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -X POST \
                 -H "Authorization: Bearer ${MS_TOKEN}" -H "Content-Type: application/json" \
                 "${API_OPEN}/deploy" 2>/dev/null)
          echo "deploy_api_http=${code}"

          # 2) 轮询：openapi 返回壳是小写 data/status，web 接口是大写 Data/Status，两者都兼容
          #    成功判据 = Running 且 DeployedTime 晚于 push_time（防止旧实例 Running 误判）
          for i in $(seq 1 60); do
            body=$(curl -sS --max-time 20 "${API_WEB}" 2>/dev/null)
            st=PARSE_ERR; dt=0
            parsed=$(printf '%s' "$body" | python3 -c "import sys,json;d=json.load(sys.stdin);o=d.get('data') if isinstance(d.get('data'),dict) else (d.get('Data') or {});o=o if isinstance(o,dict) else {};print((o.get('status') or o.get('Status') or 'PARSE_ERR'),(o.get('deployedTime') or o.get('DeployedTime') or 0))" 2>/dev/null)
            if [ -n "$parsed" ]; then
              st=$(echo "$parsed" | awk '{print $1}')
              dt=$(echo "$parsed" | awk '{print $2}')
            else
              echo "  （解析失败，响应前 120 字符：$(printf '%s' "$body" | head -c 120)）"
            fi
            echo "[$i] status=${st} deployed_time=${dt}"
            case "$st" in
              *Failed*) echo "BUILD_FAILED：构建或启动失败，需人工取构建日志"; exit 1 ;;
              Running)
                if [ "$dt" -gt "$start_ts" ] 2>/dev/null; then
                  echo "BUILD_OK deployed_time=${dt}（晚于 push 时间，本次产物已上线）"; exit 0
                else
                  echo "  旧实例 Running 且 DeployedTime 未更新，继续等待本次构建"
                fi ;;
            esac
            sleep 30
          done
          echo "TIMEOUT：30 分钟内未见新构建产物上线"; exit 1
