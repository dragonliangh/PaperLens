name: CI/CD - Test & Deploy to ModelScope

on:
  push:
    branches: [ master ]

jobs:
  # ==========================================================================
  # Job 1: 测试 (CI) - 确保代码在干净环境能跑通
  # ==========================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ./models
          key: models-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest modelscope

      - name: Download models (if cache miss)
        run: |
          if [ ! -d "./models/bge-small-en-v1.5" ]; then
            echo "模型不存在，从 ModelScope 下载..."
            python -c "from modelscope import snapshot_download; snapshot_download('BAAI/bge-small-en-v1.5', local_dir='./models/bge-small-en-v1.5', max_workers=8); snapshot_download('BAAI/bge-reranker-base', local_dir='./models/bge-reranker-base', max_workers=8)"
          else
            echo "模型缓存命中，跳过下载。"
          fi

      - name: Run core tests
        env:
          HF_HUB_OFFLINE: 1
          TRANSFORMERS_OFFLINE: 1
        run: |
          echo "=== 1. 解析与索引测试 ==="
          pytest test_ingest.py test_index_store.py -v

          echo "=== 2. 评估逻辑测试（排除依赖 API Key 的用例）==="
          pytest test_eval.py -v -k "not test_answer_on_answerable and not test_chinese_query_uses_zh_threshold"

          echo "=== 3. QA 异常文案映射纯函数测试 ==="
          pytest test_qa.py -v -k "test_20e_error_to_message"

  # ==========================================================================
  # Job 2: 部署 (CD) - 触发魔搭平台拉取 master 分支重新构建 Docker
  # ==========================================================================
  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger ModelScope Rebuild
        run: |
          echo "正在通知魔搭重新构建..."
          # 【核心逻辑】使用魔搭官方的 OpenAPI 触发构建（需在 Secrets 配好 MS_TOKEN）
          # 【假设】你已经在 GitHub Secrets 配置了 MODELSCOPE_TOKEN 和 MODELSCOPE_REPO_ID
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://www.modelscope.cn/openapi/v1/studios/${{ secrets.MODELSCOPE_REPO_ID }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.MODELSCOPE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "已成功通知魔搭，正在后台按 Dockerfile 构建。请去魔搭网页查看构建日志。"
          else
            echo "通知失败，HTTP 状态码: $HTTP_CODE"
            exit 1
          fi