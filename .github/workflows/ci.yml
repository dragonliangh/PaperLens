# ==============================================================================
# PaperLens CI/CD 流水线
# ==============================================================================
# 【模块职责】
#   每次 push 到 main/master 分支时，在干净的 Linux 环境里自动完成：
#   安装依赖 -> 下载模型 -> 跑核心测试 -> 同步到魔搭创空间 -> 触发部署。
#   全程无需人工干预，测试不过则不部署。
#
# 【在架构中的位置】
#   开发流程的自动化门禁。不参与运行时请求，但决定了代码能否上线。
#
# 【类级（Job 级）说明】
#   单 Job（test-and-deploy）串行执行。原因见 DESIGN.md D1：
#   避免多 Job 间传递几百 MB 的模型缓存和依赖 artifact。
#
# 【边界级说明】
#   - 不跑真实 API 测试：避免免费档 429 导致 CI 随机变红并阻塞部署。
#   - 部署 API 只验 HTTP 200：魔搭重启耗时 15-30 分钟，CI 不等待异步结果。
# ==============================================================================

name: CI/CD - Test & Deploy to ModelScope

on:
  # 【触发条件】仅主干 push 触发。未来多人协作时需按 README 的演进指南加 PR 触发。
  push:
    branches: [ master, main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    # 【边界】20 分钟超时。正常流程约 5-8 分钟，若超时通常是因为外部包源或魔搭 API 异常。
    timeout-minutes: 20

    steps:
      # ----------------------------------------------------------------------
      # 1. 拉取代码
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. 设置 Python 3.13 并缓存 pip
      # ----------------------------------------------------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' # 【性能优化】自动缓存 ~/.cache/pip，后续安装极快

      # ----------------------------------------------------------------------
      # 3. 缓存模型目录
      # ----------------------------------------------------------------------
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ./models
          # 【核心逻辑】固定 key。只要模型不升级，后续每次 push 都能秒级命中。
          # 若未来更换模型版本，需将此处的 v1 改为 v2 以强制刷新缓存。
          key: models-${{ runner.os }}-v1

      # ----------------------------------------------------------------------
      # 4. 安装依赖
      # ----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 【假设】requirements.txt 里的版本锁定与本地一致，保证环境尽可能贴近。
          pip install -r requirements.txt
          # 补装 CI 必须的测试框架
          pip install pytest

      # ----------------------------------------------------------------------
      # 5. 下载模型（如果缓存未命中）
      # ----------------------------------------------------------------------
      - name: Download models (if cache miss)
        run: |
          if [ ! -d "./models/bge-small-en-v1.5" ]; then
            echo "模型不存在，从 ModelScope 下载..."
            pip install modelscope
            # 【修复】将 Python 代码压成一行，避免 YAML 多行缩进导致 Python 报 IndentationError。
            python -c "from modelscope import snapshot_download; snapshot_download('BAAI/bge-small-en-v1.5', local_dir='./models/bge-small-en-v1.5'); snapshot_download('BAAI/bge-reranker-base', local_dir='./models/bge-reranker-base')"
          else
            echo "模型缓存命中，跳过下载。"
          fi

      # ----------------------------------------------------------------------
      # 6. 跑核心测试
      # ----------------------------------------------------------------------
      - name: Run core tests
        env:
          # 【边界】强制离线，防止 transformers 在 CI 里尝试联网做版本检查而卡住。
          HF_HUB_OFFLINE: 1
          TRANSFORMERS_OFFLINE: 1
        run: |
          echo "=== 1. 解析与索引测试 ==="
          pytest test_ingest.py test_index_store.py -v

          echo "=== 2. 评估逻辑纯函数测试（跳过需要真实 Chroma 索引的测试）==="
          pytest test_eval.py -v -k "not needs_sample"

          echo "=== 3. QA 异常文案映射纯函数测试 ==="
          pytest test_qa.py -v -k "test_20e_error_to_message"

      # ----------------------------------------------------------------------
      # 7.1 同步代码到魔搭创空间
      # ----------------------------------------------------------------------
      - name: Sync to ModelScope
        # 【假设】使用开源社区成熟的 action 处理魔搭的 token 认证。
        uses: xiaoyao9184/modelscope-sync-action@main
        with:
          repo_path: '.'
          modelscope_repo_id: ${{ secrets.MODELSCOPE_REPO_ID }}
          modelscope_token: ${{ secrets.MODELSCOPE_TOKEN }}
          repo_type: 'studio'
          sdk_type: 'docker'
          generate_message: true

      # ----------------------------------------------------------------------
      # 7.2 触发魔搭重新部署
      # ----------------------------------------------------------------------
      - name: Trigger ModelScope Deploy
        run: |
          echo "正在触发魔搭部署 API..."
          # 【边界】只验证触发成功（HTTP 200），不等待魔搭后台的异步构建与重启。
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://www.modelscope.cn/openapi/v1/studios/${{ secrets.MODELSCOPE_REPO_ID }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.MODELSCOPE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "部署触发成功 (200 OK)。请注意：魔搭服务实际重启约需 15-30 分钟。"
          else
            echo "部署触发失败，HTTP 状态码: $HTTP_CODE"
            exit 1
          fi